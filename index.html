<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RX Empire</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #333;
            touch-action: manipulation;
            box-sizing: border-box;
        }
        .container {
            background: #fff;
            padding: 15px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
            width: 100%;
            max-width: 420px;
            box-sizing: border-box;
        }
        h1 {
            margin: 0 0 10px 0;
            font-size: 26px;
            color: #222;
        }
        .user-info {
            background: #eef2f7;
            padding: 8px 12px;
            border-radius: 10px;
            margin: 10px 0;
            font-size: 13px;
            text-align: left;
        }
        .status {
            margin: 5px 0;
            font-size: 12px;
            color: #555;
        }
        .score {
            font-size: 38px;
            font-weight: bold;
            color: #4a5568;
            margin: 10px 0;
        }
        .button-group {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin: 8px 0;
        }
        .btn-primary, .btn-secondary {
            padding: 12px;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            color: #fff;
        }
        .btn-primary {
            background: #6b46c1;
        }
        .btn-secondary {
            background: #cbd5e0;
            color: #333;
        }
        .info {
            margin-top: 10px;
            font-size: 11px;
            color: #718096;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🎮 RX_Empire</h1>
    
    <div id="userInfo" class="user-info" style="display: none;">
        <div>👤 <strong>User:</strong> <span id="userName">Unknown</span></div>
        <div>🆔 <strong>ID:</strong> <span id="userId">-</span></div>
    </div>

    <div class="status" id="status">
        ⏳ Initializing Telegram Web App...
    </div>

    <div class="score">
        <span id="score">0</span> 🪙
    </div>

    <!-- Зона клика с увеличенной картинкой -->
    <div id="clickArea" style="cursor: pointer; display: flex; justify-content: center; align-items: center; margin: 15px auto; width: 190px; height: 190px; touch-action: manipulation;">
        <img src="RX-Empire.png" alt="RX Empire" style="width: 180px; height: 180px; border-radius: 50%; object-fit: cover; user-select: none; pointer-events: none;">
    </div>

    <!-- Кнопки управления монетами -->
    <div class="button-group">
        <button class="btn-primary" style="flex: 1;" onclick="addCoins(100)">+100</button>
        <button class="btn-primary" style="flex: 1;" onclick="addCoins(1000)">+1000</button>
        <button class="btn-secondary" style="flex: 1;" onclick="resetScore()">Reset</button>
    </div>

    <!-- Кнопки Друзья и Задания -->
    <div class="button-group" style="margin-top: 8px;">
        <button class="btn-primary" onclick="inviteFriend()" style="background: #3182ce; flex: 1; font-size: 15px;">👥 Друзья</button>
        <button class="btn-primary" onclick="openTask()" style="background: #d69e2e; flex: 1; font-size: 15px;">⭐ Задания</button>
    </div>

    <!-- Инфо о конвертации и вывод -->
    <div class="user-info" style="background: #fffaf0; border-left: 4px solid #dd6b20; margin: 10px 0; text-align: left;">
        💰 <strong>Конвертация:</strong> 10 000 монет = 1 Сомони<br>
        <span style="font-size: 11px; color: #718096;">Обменивай игровые монеты на реальные деньги!</span>
    </div>

    <div class="button-group" style="margin-top: 8px;">
        <button class="btn-primary" onclick="openWithdrawModal()" style="background: #38a169; width: 100%; font-size: 15px;">💸 Вывести в Сомони</button>
    </div>

    <div class="info">
        Click the circle or use buttons to earn coins!
    </div>
</div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
    const tg = window.Telegram.WebApp;

    if (tg) {
        tg.ready();
        tg.expand();
    }

    const user = tg.initDataUnsafe?.user;
    const statusEl = document.getElementById('status');

    if (user) {
        document.getElementById('userInfo').style.display = 'block';
        document.getElementById('userName').textContent = user.first_name || 'User';
        document.getElementById('userId').textContent = user.id || '-';
        statusEl.textContent = '✅ Connected to Telegram!';
    } else {
        statusEl.textContent = '⚠️ Not running in Telegram';
    }

    let score = parseInt(localStorage.getItem('hamsterScore')) || 0;
    const scoreEl = document.getElementById('score');
    const clickArea = document.getElementById('clickArea');

    function updateScoreDisplay() {
        scoreEl.textContent = score;
        localStorage.setItem('hamsterScore', score);
    }

    function addCoins(amount) {
        score += amount;
        updateScoreDisplay();
    }

    function resetScore() {
        score = 0;
        updateScoreDisplay();
    }

    clickArea.addEventListener('click', () => {
        addCoins(1);
    });

    updateScoreDisplay();

    // Функция приглашения друзей
    function inviteFriend() {
        const userId = user ? user.id : '';
        const botUsername = 'RX_Empire_bot'; // Укажите вашего бота без @
        const inviteUrl = `https://t.me/share/url?url=https://t.me/${botUsername}?start=ref_${userId}&text=Играй со мной в RX Empire и зарабатывай монеты! 🚀`;
        
        if (tg && tg.openTelegramLink) {
            tg.openTelegramLink(inviteUrl);
        } else {
            window.open(inviteUrl, '_blank');
        }
    }

    // Функция заданий (исправленная для открытия канала)
   function openTask() {
    const channelUrl = 'https://t.me/rx_empire_channel';
    
    // Начисляем бонусные монеты за задание
    addCoins(500);
    
    // Безопасное открытие ссылки в Telegram
    if (window.Telegram && window.Telegram.WebApp) {
        window.Telegram.WebApp.openTelegramLink(channelUrl);
    } else {
        window.open(channelUrl, '_blank');
    }
}

    // Функция вывода в сомони
    function openWithdrawModal() {
        const minCoins = 10000;
        if (score < minCoins) {
            alert(`❌ Недостаточно монет для вывода!\nМинимальная сумма: ${minCoins} монет.`);
        } else {
            const adminUsername = 'RX_Empire_bot'; // Укажите ваш юзернейм для связи
            const userId = user ? user.id : 'unknown';
            const withdrawUrl = `https://t.me/${adminUsername}?text=Здравствуйте! Я хочу обменять свои ${score} монеты RX Empire на сомони. Мой ID: ${userId}`;
            
            if (tg && tg.openTelegramLink) {
                tg.openTelegramLink(withdrawUrl);
            } else {
                window.open(withdrawUrl, '_blank');
            }
        }
    }
</script>

</body>
</html>
