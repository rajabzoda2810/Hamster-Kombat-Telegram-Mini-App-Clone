<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RX Empire</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 5px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            min-height: 100dvh;
            color: #333;
            touch-action: none;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
        }
        .container {
            background: transparent;
            padding: 2px;
            text-align: center;
            width: 100%;
            height: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            position: relative;
            overflow: hidden;
            touch-action: none;
        }
        h1 {
            margin: 2px 0;
            font-size: 20px;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }
        .user-info {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            padding: 3px 6px;
            border-radius: 8px;
            margin: 2px 0;
            font-size: 11px;
            text-align: left;
            color: #fff;
        }
        .status {
            margin: 1px 0;
            font-size: 9px;
            color: #e2e8f0;
        }
        .score-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin: 2px 0;
        }
        .score {
            font-size: 24px;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 3px 6px rgba(0,0,0,0.3);
        }
        .score-icon {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            object-fit: cover;
            box-shadow: 0 3px 6px rgba(0,0,0,0.3);
            border: 2px solid rgba(255, 255, 255, 0.8);
        }
        .button-group {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 6px;
            justify-content: center;
            margin: 4px 0;
            flex-shrink: 0;
        }
        .btn-primary {
            padding: 8px 6px;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            color: #fff;
            touch-action: manipulation;
            background: #6b46c1;
            text-align: center;
            white-space: nowrap;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
        }
        .btn-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            line-height: 1.1;
        }
        .btn-icon {
            font-size: 16px;
        }
        .btn-label {
            font-size: 10px;
            font-weight: normal;
            opacity: 0.9;
        }

        .info {
            margin-bottom: 2px;
            font-size: 10px;
            color: #cbd5e0;
            flex-shrink: 0;
        }

        #gameCanvasContainer {
            position: relative;
            margin: auto;
            width: 320px;
            height: 270px;
            background: linear-gradient(to bottom, #4fd1c5, #63b3ed);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            border: 3px solid rgba(255, 255, 255, 0.8);
            cursor: pointer;
            flex-shrink: 0;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 200;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.6);
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background-color: #fff;
            padding: 20px;
            border-radius: 20px;
            width: 90%;
            max-width: 350px;
            text-align: left;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            max-height: 80vh;
            overflow-y: auto;
        }
        /* Увеличили размер текста, эмодзи и иконок в списке друзей */
        .reward-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
            font-size: 16px;
        }
        .task-item {
            background: #f7fafc;
            padding: 10px;
            border-radius: 12px;
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .task-info {
            font-size: 13px;
            font-weight: bold;
            color: #2d3748;
        }
