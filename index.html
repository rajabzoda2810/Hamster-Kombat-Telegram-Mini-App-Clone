<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RX Empire</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #333;
        }
        .container {
            background: #fff;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
            width: 100%;
            max-width: 380px;
            box-sizing: border-box;
        }
        h1 {
            margin-top: 0;
            color: #222;
        }
        .user-info {
            background: #eef2f7;
            padding: 10px;
            border-radius: 10px;
            margin: 15px 0;
            font-size: 14px;
            text-align: left;
        }
        .status {
            margin: 10px 0;
            font-size: 13px;
            color: #555;
        }
        .score {
            font-size: 32px;
            font-weight: bold;
            color: #4a5568;
            margin: 15px 0;
        }
        .button-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin: 15px 0;
        }
        .btn-primary, .btn-secondary {
            padding: 10px 15px;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            color: #fff;
        }
        .btn-primary {
            background: #6b46c1;
        }
        .btn-secondary {
            background: #cbd5e0;
            color: #333;
        }
        .info {
            margin-top: 15px;
            font-size: 12px;
            color: #718096;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🎮 RX_Empire</h1>
    
    <div id="userInfo" class="user-info" style="display: none;">
        <div>👤 <strong>User:</strong> <span id="userName">Unknown</span></div>
        <div>🆔 <strong>ID:</strong> <span id="userId">-</span></div>
    </div>

    <div class="status" id="status">
        ⏳ Initializing Telegram Web App...
    </div>

    <div class="score">
        <span id="score">0</span> 🪙
    </div>

    <!-- Единая чистая зона клика с вашей картинкой -->
<div id="clickArea" style="cursor: pointer; display: flex; justify-content: center; align-items: center; margin: 20px auto; width: 160px; height: 160px; touch-action: manipulation;">
    <img src="RX-Empire.png" alt="RX Empire" style="width: 150px; height: 150px; border-radius: 50%; object-fit: cover; user-select: none; pointer-events: none;">
</div>

    <div class="button-group">
        <button class="btn-primary" onclick="addCoins(100)">+100</button>
        <button class="btn-primary" onclick="addCoins(1000)">+1000</button>
        <button class="btn-secondary" onclick="resetScore()">Reset</button>
    </div>

    <div class="info">
        Click the circle or use buttons to earn coins!
    </div>
</div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
    // Initialize Telegram Web App
    const tg = window.Telegram.WebApp;

    if (tg) {
        tg.ready();
        tg.expand();
    }

    const user = tg.initDataUnsafe?.user;
    const statusEl = document.getElementById('status');

    if (user) {
        document.getElementById('userInfo').style.display = 'block';
        document.getElementById('userName').textContent = user.first_name || 'User';
        document.getElementById('userId').textContent = user.id || '-';
        statusEl.textContent = '✅ Connected to Telegram!';
    } else {
        statusEl.textContent = '⚠️ Not running in Telegram';
    }

    // Score management
    let score = parseInt(localStorage.getItem('hamsterScore')) || 0;
    const scoreEl = document.getElementById('score');
    const clickArea = document.getElementById('clickArea');

    function updateScoreDisplay() {
        scoreEl.textContent = score;
        localStorage.setItem('hamsterScore', score);
    }

    function addCoins(amount) {
        score += amount;
        updateScoreDisplay();
    }

    function resetScore() {
        score = 0;
        updateScoreDisplay();
    }

    clickArea.addEventListener('click', () => {
        addCoins(1);
    });

    updateScoreDisplay();
</script>

</body>
</html>
